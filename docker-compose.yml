services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: medfind
      POSTGRES_PASSWORD: medfind
      POSTGRES_DB: medfind
    volumes:
      - medfind_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medfind -d medfind"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      CRAWL_SOURCES: ${CRAWL_SOURCES:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_CSE_ID: ${GOOGLE_CSE_ID:-}
      DATABASE_URL: postgresql+psycopg2://medfind:medfind@db:5432/medfind
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-long-random-string}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    ports:
      - "8000:8000"

  # Keeps the web product index fresh: crawls Iranian online pharmacies every 6 h.
  crawler:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://medfind:medfind@db:5432/medfind
      CRAWL_SOURCES: ${CRAWL_SOURCES:-}
      HTTPS_PROXY: ${CRAWL_PROXY:-}
      HTTP_PROXY: ${CRAWL_PROXY:-}
    command: ["python", "-m", "scripts.crawl", "--loop", "--every", "6"]

  # Database-only stress test. Not started by `docker compose up`;
  # run it explicitly:  docker compose --profile stress run --rm stress
  stress:
    build: .
    profiles: ["stress"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://medfind:medfind@db:5432/medfind
    command: >
      python scripts/stress_test_postgres.py
      --duration ${STRESS_DURATION:-20}
      --concurrency ${STRESS_CONCURRENCY:-10}
      --read-ratio ${STRESS_READ_RATIO:-0.8}

volumes:
  medfind_pgdata:
