services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medfind
      POSTGRES_PASSWORD: medfind
      POSTGRES_DB: medfind
    ports:
      - "5432:5432"
    volumes:
      - medfind_pgdata:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://medfind:medfind@db:5432/medfind
      SECRET_KEY: local-dev-only-secret
      DEBUG: "true"
    ports:
      - "8000:8000"

volumes:
  medfind_pgdata:
