<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>My pharmacy · MedFind</title>
<script>document.documentElement.dataset.theme=localStorage.getItem('medfind_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')</script>
<link rel="preload" href="fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/medfind.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="siteNav"></header>
<main id="main" class="page wrap" aria-live="polite"><div class="skeleton" style="height:240px"></div></main>

<dialog class="sheet" id="addDialog" aria-labelledby="addTitle">
  <form class="sheet__form" id="addForm" method="dialog">
    <div class="sheet__head"><h2 id="addTitle">Add a medicine</h2><button class="btn btn--ghost btn--icon" type="button" data-close-dialog aria-label="Close" id="addClose"></button></div>
    <div class="sheet__body">
      <div class="field" style="position:relative">
        <label class="label" for="addMed">Medicine</label>
        <input class="input" id="addMed" autocomplete="off" placeholder="Start typing a name…" required>
        <ul class="suggest" id="addSuggest" aria-label="Medicines"></ul>
        <p class="hint" id="addPicked">Pick a medicine from the list.</p>
      </div>
      <div class="field-row field-row--3" style="margin-top:var(--s-4)">
        <div class="field"><label class="label" for="addPrice">Price</label><input class="input" id="addPrice" type="number" min="0" step="0.01" inputmode="decimal"></div>
        <div class="field"><label class="label" for="addStatus">Status</label>
          <select class="select" id="addStatus"><option value="available">Available</option><option value="limited_stock">Limited stock</option><option value="out_of_stock">Out of stock</option><option value="unknown">Not confirmed</option></select></div>
        <div class="field"><label class="label" for="addStock">Stock</label><input class="input" id="addStock" type="number" min="0" step="1" inputmode="numeric"></div>
      </div>
      <p class="form-error" id="addErr" role="alert"></p>
    </div>
    <div class="sheet__foot"><button class="btn btn--ghost" type="button" data-close-dialog>Cancel</button><button class="btn btn--primary" type="submit">Add listing</button></div>
  </form>
</dialog>

<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
